version: 2

sources:
  - name: video_games_source
    description: >
      Raw operational data for the Video Games Analytics platform.
      This source simulates data generated by an online video game marketplace.
      All downstream staging, intermediate, and mart models originate from
      these source tables.

    database: VIDEO_GAMES
    schema: RAW

    tables:

      - name: DIM_VIDEO_GAMES
        description: >
          Master catalog of video games available for purchase.

        columns:
          - name: GAME_ID
            description: Unique identifier for a game.

          - name: TITLE
            description: Official game title.

          - name: GENRE
            description: Primary game genre.

          - name: SUB_GENRE
            description: Secondary game genre classification.

          - name: PUBLISHER
            description: Company responsible for publishing the game.

          - name: DEVELOPER
            description: Studio responsible for development.

          - name: RELEASE_DATE
            description: Official release date of the game.

          - name: BASE_PRICE
            description: Standard retail price before discounts.

          - name: ESRB_RATING
            description: ESRB content rating.

      - name: DIM_CONSOLES
        description: >
          Reference table containing gaming platforms and hardware devices.

        columns:
          - name: CONSOLE_ID
            description: Unique platform identifier.

          - name: PLATFORM_NAME
            description: Commercial platform name.

          - name: PARENT_BRAND
            description: Manufacturer or platform owner.

          - name: RELEASE_DATE
            description: Console launch date.

          - name: GENERATION
            description: Console generation classification.

      - name: DIM_CUSTOMERS
        description: >
          Customer master dataset used for segmentation and behavioral analysis.

        columns:
          - name: CUSTOMER_ID
            description: Unique customer identifier.

          - name: FIRST_NAME
            description: Customer first name.

          - name: LAST_NAME
            description: Customer last name.

          - name: EMAIL
            description: Customer email address.

          - name: COUNTRY
            description: Customer country of residence.

          - name: CITY
            description: Customer city of residence.

          - name: AGE_GROUP
            description: Age band used for reporting.

          - name: GENDER
            description: Customer gender classification.

          - name: SIGNUP_DATE
            description: Customer registration date.

      - name: DIM_GEOGRAPHY
        description: >
          Geographic reference data used for regional reporting.

        columns:
          - name: GEO_ID
            description: Unique geography identifier.

          - name: COUNTRY
            description: Country name.

          - name: REGION
            description: Regional grouping.

          - name: CONTINENT
            description: Continental grouping.

      - name: DIM_MARKETING_CHANNEL
        description: >
          Marketing acquisition channels responsible for customer traffic.

        columns:
          - name: CHANNEL_ID
            description: Unique channel identifier.

          - name: CHANNEL_NAME
            description: Marketing channel name.

      - name: DIM_PAYMENT_METHOD
        description: >
          Supported payment methods used during checkout.

        columns:
          - name: PAYMENT_METHOD_ID
            description: Unique payment method identifier.

          - name: METHOD_NAME
            description: Payment method name.

      - name: FACT_GAME_SALES
        description: >
          Transaction-level sales fact table.
          Each row represents a completed or attempted purchase.

        columns:
          - name: ORDER_ID
            description: Unique order identifier.

          - name: CUSTOMER_ID
            description: Customer associated with the transaction.

          - name: GAME_ID
            description: Purchased game identifier.

          - name: CONSOLE_ID
            description: Platform used for purchase.

          - name: GEO_ID
            description: Geography associated with the order.

          - name: CHANNEL_ID
            description: Marketing acquisition source.

          - name: PAYMENT_METHOD_ID
            description: Payment method used for payment.

          - name: ORDER_TIMESTAMP
            description: Date and time of transaction.

          - name: QUANTITY
            description: Number of units purchased.

          - name: UNIT_PRICE
            description: Selling price per unit.

          - name: DISCOUNT_AMOUNT
            description: Discount applied to the transaction.

          - name: TAX_AMOUNT
            description: Tax charged for the transaction.

          - name: ORDER_STATUS
            description: Final order status.

      - name: GAME_PRICE_HISTORY
        description: >
          Historical game pricing changes used for trend analysis
          and future snapshot implementations.

        columns:
          - name: PRICE_CHANGE_ID
            description: Unique price change identifier.

          - name: GAME_ID
            description: Associated game identifier.

          - name: OLD_PRICE
            description: Previous game price.

          - name: NEW_PRICE
            description: Updated game price.

          - name: EFFECTIVE_DATE
            description: Date the new price became effective.

      - name: CUSTOMER_GAME_REVIEWS
        description: >
          Customer-generated ratings and reviews for purchased games.

        columns:
          - name: REVIEW_ID
            description: Unique review identifier.

          - name: CUSTOMER_ID
            description: Customer who submitted the review.

          - name: GAME_ID
            description: Reviewed game identifier.

          - name: RATING
            description: Numerical game rating.

          - name: REVIEW_TEXT
            description: Free-text customer feedback.

          - name: REVIEW_DATE
            description: Date review was submitted.